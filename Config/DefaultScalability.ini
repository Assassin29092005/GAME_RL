; The environment packs stream 4K textures: give them room at the high qualities, but never more than the card's VRAM
; holds (LimitPoolSizeToVRAM; the engine turns it off at Epic / Cinematic). Low and Medium keep the engine's pools.
[TextureQuality@2]
r.Streaming.PoolSize=2000
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@3]
r.Streaming.PoolSize=3000
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@Cine]
r.Streaming.PoolSize=3000
r.Streaming.LimitPoolSizeToVRAM=1
