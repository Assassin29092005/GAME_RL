BuildConfiguration=PPBC_Shipping
UsePakFile=True
; Cook to loose files under Saved\Cooked (D:), not into the Zen store: Zen's data lives on C:, which is full here.
bUseZenStore=False
bUseIoStore=True
bCompressed=True
IncludeDebugFiles=False
