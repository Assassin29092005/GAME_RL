[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=HellwalkerRL
Description=A boss trained with reinforcement learning that reads you, adapts, and counterattacks.

[/Script/UnrealEd.ProjectPackagingSettings]
; Tools\Package.bat. The game loads its pack content BY PATH (optional loaders with greybox fallbacks), so nothing
; references it from the maps: every folder the code loads from is listed here (the narrowest folders; the cooker
; follows their materials and textures itself). The RL keeper's weights are staged as a loose file.
